server:
  port: 8089

spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "https://vzzg205m-3000.use.devtunnels.ms"
              - "https://vzzg205m-3000.use.devtunnels.ms"
              - "http://localhost:3000"
              - "http://localhost:3001"
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
        - AddResponseHeader=Access-Control-Allow-Private-Network, true
      routes:
        - id: auth
          uri: lb://auth
          predicates:
            - Path=/auth/**

        - id: user
          uri: lb://user
          predicates:
            - Path=/users/**,/demandes/**

        - id: logement
          uri: lb://logement
          predicates:
            - Path=/logements/**,/api/v1/logements/**,/api/v1/newsletter/**

        - id: reservation
          uri: lb://reservation
          predicates:
            - Path=/api/reservations/**,/reservations/**

        - id: payment
          uri: lb://payment
          predicates:
            - Path=/payments/**,/api/payments/**,/abonnements/**,/reversements/**,/webhooks/**

        - id: messagerie
          uri: lb://messagerie
          predicates:
            - Path=/messages/**

        - id: admin
          uri: lb://admin
          predicates:
            - Path=/admin/**

  main:
    web-application-type: reactive
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
